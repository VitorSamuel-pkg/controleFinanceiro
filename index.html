<!doctype html>
<html lang="pt-br">
  <head>
    <style>
      html,
      body {
        background: #18181b;
        margin: 0;
        padding: 0;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json" />

    <!-- Cor do app -->
    <meta name="theme-color" content="#18181b" />

    <!-- Favicons -->
    <link rel="icon" href="./icons/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="./icons/favicon-16x16.png"
    />

    <!-- iPhone/iPad -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- PWA iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Financeiro" />

    <title>Controle Financeiro</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-zinc-950 text-white min-h-screen p-4 md:p-8">
    <div class="flex flex-col md:flex-row justify-center items-start gap-8">
      <div
        class="w-full md:flex-1 max-w-4xl bg-zinc-900 p-6 md:p-8 rounded-3xl shadow-2xl"
      >
        <h1 class="text-4xl font-bold mb-2">
          Controle Financeiro
          <i
            class="animate-bounce fa-solid fa-money-bill-wave text-green-400 pl-4"
          ></i>
        </h1>

        <p class="text-zinc-400 mb-8">Adicione ganhos e gastos</p>

        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block mb-2">Títulos</label>

            <input
              id="titulos"
              type="text"
              placeholder="Mercado, Uber, Lanche"
              class="w-full p-3 rounded-2xl bg-zinc-800 border border-zinc-700"
            />
          </div>

          <div>
            <label class="block mb-2">Valores</label>

            <input
              id="valores"
              type="text"
              placeholder="120, 35, 18.50"
              class="w-full p-3 rounded-2xl bg-zinc-800 border border-zinc-700"
            />
          </div>
        </div>

        <div class="mt-4">
          <label class="block mb-2">Tipo de pagamento</label>
          <select
            id="tipoPagamento"
            class="w-full p-3 rounded-2xl bg-zinc-800 border border-zinc-700"
          >
            <option value="Pix">Pix</option>
            <option value="Dinheiro">Dinheiro</option>
            <option value="Débito">Cartão Débito</option>
            <option value="Crédito">Cartão Crédito</option>
          </select>
        </div>

        <div class="flex gap-4 mt-6">
          <button id="btnGasto" class="flex-1 p-3 rounded-2xl bg-red-500">
            Gasto
          </button>

          <button id="btnGanho" class="flex-1 p-3 rounded-2xl bg-zinc-800">
            Ganho
          </button>
        </div>

        <button
          id="adicionar"
          class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-2xl mt-6"
        >
          Adicionar
        </button>

        <div class="bg-zinc-800 p-6 rounded-2xl mt-8">
          <h2 class="text-2xl font-bold mb-4">Resumo</h2>

          <div id="lista" class="space-y-2 mb-6"></div>

          <div class="grid md:grid-cols-3 gap-4">
            <div class="bg-green-600 p-4 rounded-2xl">
              <p>Ganhos</p>
              <h3 id="ganhos" class="text-2xl font-bold">R$0.00</h3>
            </div>

            <div class="bg-red-600 p-4 rounded-2xl">
              <p>Gastos</p>
              <h3 id="gastos" class="text-2xl font-bold">R$0.00</h3>
            </div>

            <div class="bg-blue-600 p-4 rounded-2xl">
              <p>Saldo</p>
              <h3 id="saldo" class="text-2xl font-bold">R$0.00</h3>
            </div>
          </div>
        </div>

        <div
          class="flex flex-col lg:flex-row justify-between pt-4 items-stretch gap-4"
        >
          <button
            id="excluir"
            class="w-full lg:w-auto bg-red-700 hover:bg-red-600 p-4 rounded-2xl"
          >
            Excluir
          </button>

          <div class="flex flex-col sm:flex-row gap-4 w-full lg:w-auto">
            <button
              id="exportarMd"
              class="w-full sm:w-[160px] bg-zinc-700 hover:bg-zinc-600 p-4 rounded-2xl"
            >
              Exportar .md
            </button>

            <button
              id="exportarCsv"
              class="w-full sm:w-[160px] bg-zinc-700 hover:bg-zinc-600 p-4 rounded-2xl"
            >
              Exportar .csv
            </button>
          </div>
        </div>
      </div>
      <div class="w-full md:w-[320px] bg-zinc-900 rounded-3xl shadow-2xl p-6">
        <h2 class="text-2xl font-bold mb-4">Histórico</h2>

        <div id="historico" class="flex flex-col gap-3"></div>
      </div>
    </div>

    <script src="./script.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./service-worker.js")
            .then((registration) => {
              console.log("Service Worker registrado");
            })
            .catch((error) => {
              console.error("Erro ao registrar SW:", error);
            });
        });
      }
    </script>
  </body>
</html>
